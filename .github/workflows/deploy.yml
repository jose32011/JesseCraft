
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: voxland-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            JesseArcade/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix JesseArcade
          npm ci --prefix tv
          npm ci --prefix tv

      - name: Run tests
        run: |
          npm test
          npm --prefix JesseArcade test

      - name: Build JesseCraft for the arcade
        run: npm run build:arcade
      - name: Build tv app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: npm run build --prefix tv
      - name: Build tv app
        run: npm run build --prefix tv

      - name: Package release
        run: |
          set -euo pipefail

          tar \
            --exclude='./.git' \
            --exclude='*/.git' \
            --exclude='./node_modules' \
            --exclude='*/node_modules' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.data' \
            --exclude='./.vite' \
            --exclude='./src/assets/new/metaworldos-tank-battle-pack' \
            -czf "$RUNNER_TEMP/voxland-release.tar.gz" .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" \
            | tr -d '\r' > "$HOME/.ssh/voxland_deploy"

          chmod 600 "$HOME/.ssh/voxland_deploy"

          echo "Validating SSH private key..."
          ssh-keygen -y \
            -f "$HOME/.ssh/voxland_deploy" \
            > /dev/null

          echo "SSH key fingerprint:"
          ssh-keygen -y \
            -f "$HOME/.ssh/voxland_deploy" \
            | ssh-keygen -lf -

          echo "Scanning VPS host key..."
          ssh-keyscan -H "$VPS_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test VPS SSH authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          echo "Testing SSH authentication for $VPS_USER@$VPS_HOST"

          ssh -vv \
            -i "$HOME/.ssh/voxland_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            'echo "GitHub Actions SSH login successful"'

      - name: Prepare VPS upload directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/voxland_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob

          stale_archives=(
            /tmp/voxland-release-*.tar.gz
            "$HOME"/voxland-release-*.tar.gz
          )

          for archive in "${stale_archives[@]}"; do
            [ ! -f "$archive" ] || rm -f -- "$archive"
          done

          echo "Available space before upload:"
          df -h "$HOME" /tmp

          probe="$(mktemp "$HOME/.voxland-upload-check.XXXXXX")"
          rm -f -- "$probe"
          REMOTE

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          scp \
            -i "$HOME/.ssh/voxland_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/voxland-release.tar.gz" \
            "$VPS_USER@$VPS_HOST:voxland-release-$GITHUB_SHA.tar.gz"

      - name: Deploy release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          ssh \
            -i "$HOME/.ssh/voxland_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "GITHUB_SHA=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail

          release="/opt/voxland/releases/$GITHUB_SHA"
          releases_dir="/opt/voxland/releases"
          current="/opt/voxland/current"
          archive="$HOME/voxland-release-$GITHUB_SHA.tar.gz"

          trap 'rm -f -- "$archive"' EXIT

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          previous="$(readlink "$current" 2>/dev/null || true)"
          current_target="$(readlink -f "$current" 2>/dev/null || true)"

          mkdir -p "$releases_dir"

          while IFS= read -r -d '' stale_release; do
            if [ "$stale_release" = "$current_target" ] ||
               [ "$stale_release" = "$release" ]; then
              continue
            fi

            echo "Removing obsolete release directory: $stale_release"
            rm -rf -- "$stale_release"
          done < <(
            find "$releases_dir" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -regextype posix-extended \
              -regex "$releases_dir/[0-9a-f]{40}" \
              -print0
          )

          if [ -e "$release" ] && [ "$release" != "$current_target" ]; then
            echo "Removing incomplete target release: $release"
            rm -rf -- "$release"
          fi

          echo "Available release disk space before extraction:"
          df -h "$releases_dir"

          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"

          cd "$release"

          npm ci --omit=dev
          npm ci --omit=dev --prefix JesseArcade
          npm ci --omit=dev --prefix tv

          install -m 0644 \
            "$release/deploy/voxland.service" \
            /etc/systemd/system/voxland.service

          systemctl daemon-reload

          ln -sfn "$release" /opt/voxland/current.next
          mv -Tf /opt/voxland/current.next "$current"

          rollback() {
            echo "Deployment health check failed; collecting Voxland service diagnostics."

            systemctl --no-pager --full status voxland || true
            journalctl -u voxland -n 80 --no-pager || true

            if [ -n "$previous" ]; then
              ln -sfn "$previous" /opt/voxland/current.next
              mv -Tf /opt/voxland/current.next "$current"
              systemctl restart voxland || true
            fi

            exit 1
          }

          systemctl restart voxland || rollback

          for attempt in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              --connect-timeout 2 \
              --max-time 5 \
              http://127.0.0.1:3001/api/healthz >/dev/null; then
              echo "Voxland deployment is healthy."
              exit 0
            fi

            sleep 2
          done

          rollback
          REMOTE
